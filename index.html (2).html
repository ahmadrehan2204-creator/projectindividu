.bubble::after{content:"";position:absolute;left:-11px;bottom:14px;width:16px;height:16px;background:var(--card);border-left:2.5px solid var(--edge);border-bottom:2.5px solid var(--edge);transform:rotate(45deg)}
#mascot{width:118px;height:auto;flex:none;order:-1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.arm{transform-origin:128px 108px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-28deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-24deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.stage{position:relative;flex:1;width:100%;max-width:900px;min-height:0;perspective:1100px;display:flex;justify-content:center;align-items:center;touch-action:pan-y}
.ring{position:absolute;width:min(560px,92vw);aspect-ratio:1;border:3px dashed var(--edge);border-radius:50%;opacity:.18;animation:spin 40s linear infinite;top:50%;left:50%;margin:calc(min(560px,92vw)/-2) 0 0 calc(min(560px,92vw)/-2)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:absolute;top:50%;left:50%;width:min(330px,74vw);max-height:100%;background:var(--card);border:3px solid var(--edge);border-radius:28px;box-shadow:6px 6px 0 var(--edge);overflow:hidden;
transition:transform .6s cubic-bezier(.2,.9,.25,1.05),opacity .5s,filter .5s;transform-style:preserve-3d;display:flex;flex-direction:column}
.card[data-pos="0"]{transform:translate(-50%,-50%) scale(1);z-index:3}
.card[data-pos="1"]{transform:translate(-50%,-50%) translateX(78%) rotateY(-38deg) scale(.82);opacity:.6;filter:saturate(.7);z-index:1}
.card[data-pos="-1"]{transform:translate(-50%,-50%) translateX(-78%) rotateY(38deg) scale(.82);opacity:.6;filter:saturate(.7);z-index:1}
.card:not([data-pos="0"]){cursor:pointer}
.art{height:150px;display:grid;place-items:center;position:relative;border-bottom:3px solid var(--edge)}
.art svg{width:120px;height:120px}
.art.park{background:linear-gradient(160deg,#8ec5ff,#a78bfa)}
.art.kasir{background:repeating-linear-gradient(90deg,var(--red) 0 30px,#fff 30px 60px);background-size:auto 46px;background-repeat:repeat-x;background-color:#ffe9ee}
.art.kasir::before{content:"";position:absolute;inset:46px 0 0;background:#ffe9ee}
.art.kasir svg{position:relative;margin-top:22px}
.body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;color:#16204a}
:root .body h2{color:var(--ink)}
.body h2{font-size:26px;font-weight:800}
.body p{margin:0;color:var(--mut);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:800}
.go{background:var(--yel);color:#16204a;border:3px solid var(--edge);border-radius:16px;padding:12px;font-size:18px;font-weight:800;font-family:'Baloo 2',sans-serif;box-shadow:0 4px 0 var(--edge);transition:transform .12s,box-shadow .12s}
.go:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.nav{display:flex;align-items:center;gap:16px;padding:10px 0 4px;z-index:5}
.arrow{width:50px;height:50px;border-radius:50%;background:var(--card);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);font-size:22px;font-weight:800;display:grid;place-items:center}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:99px;border:2.5px solid var(--edge);background:transparent;transition:.3s}
.dots i.on{width:34px;background:var(--yel)}
.hint{margin:0;color:var(--mut);font-size:13px;text-align:center;padding-bottom:4px}
/* app layer */
#app{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;transform:translateY(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.25,1),visibility 0s .45s;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bar);border-bottom:3px solid var(--edge)}
.back{background:var(--yel);color:#16204a;border:2.5px solid var(--edge);border-radius:12px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--edge)}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.bar b{font-family:'Baloo 2',sans-serif;font-size:18px}
.bar .sw{margin-left:auto;font-size:13px;color:var(--mut);background:none;text-decoration:underline}
#frames{flex:1;position:relative}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#frames iframe.show{display:block}
@media (max-height:640px){.hero{display:none}.art{height:110px}.art svg{width:86px;height:86px}.body p{display:none}}
@media (max-width:480px){#mascot{width:92px}.bubble{font-size:13px;margin-bottom:46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

ground: linear-gradient(135deg, #60a5fa, #6366f1);\n      border-radius: 14px;\n      display: grid;\n      place-items: center;\n      color: white;\n      font-size: 22px;\n      box-shadow: 0 6px 16px rgba(59,130,246,0.35);\n      transform: rotate(-5deg);\n      transition: 0.3s;\n    }\n\n    .logo:hover .logo-icon { transform: rotate(5deg) scale(1.1); }\n\n    .logo span { color: var(--blue); }\n\n    .header-badge {\n      font-size: 12px;\n      font-weight: 800;\n      color: #059669;\n      background: var(--green-light);\n      padding: 8px 14px;\n      border-radius: 20px;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n      border: 1.5px solid #6ee7b7;\n    }\n\n    .header-badge::before {\n      content: '';\n      width: 8px;\n      height: 8px;\n      background: var(--green);\n      border-radius: 50%;\n      animation: blink 1.5s infinite;\n    }\n\n    @keyframes blink {\n      50% { opacity: 0.3; transform: scale(0.8); }\n    }\n\n    /* Container */\n    .container {\n      max-width: 920px;\n      margin: 0 auto;\n      padding: 30px 20px 60px;\n      position: relative;\n      z-index: 2;\n    }\n\n    /* ===== HERO + MASCOT ===== */\n    .hero {\n      display: flex;\n      align-items: center;\n      gap: 24px;\n      margin-bottom: 26px;\n      flex-wrap: wrap;\n      justify-content: center;\n      position: relative;\n    }\n\n    .hero-text {\n      flex: 1;\n      min-width: 260px;\n    }\n\n    .hero-tag {\n      display: inline-block;\n      background: linear-gradient(135deg, #fef3c7, #fde68a);\n      color: #b45309;\n      padding: 6px 14px;\n      border-radius: 20px;\n      font-size: 12px;\n      font-weight: 800;\n      letter-spacing: 0.5px;\n      margin-bottom: 10px;\n      border: 1.5px solid #fbbf24;\n      transform: rotate(-2deg);\n    }\n\n    .hero-text h1 {\n      font-family: 'Baloo 2', cursive;\n      font-size: clamp(30px, 5.5vw, 46px);\n      font-weight: 800;\n      line-height: 1.15;\n      margin-bottom: 10px;\n      letter-spacing: -0.5px;\n    }\n\n    .hero-text h1 em {\n      font-style: normal;\n      color: var(--blue);\n      position: relative;\n      display: inline-block;\n    }\n\n    .hero-text h1 em::after {\n      content: '';\n      position: absolute;\n      bottom: 4px;\n      left: 0;\n      right: 0;\n      height: 8px;\n      background: rgba(251, 191, 36, 0.4);\n      border-radius: 4px;\n      z-index: -1;\n    }\n\n    .hero-text p {\n      color: var(--muted);\n      font-size: 15px;\n      font-weight: 600;\n      max-width: 460px;\n    }\n\n    /* ===== MASCOT PARKY v2 ===== */\n    .mascot-wrap {\n      position: relative;\n      width: 200px;\n      height: 230px;\n      flex-shrink: 0;\n    }\n\n    .mascot {\n      position: relative;\n      width: 100%;\n      height: 100%;\n      animation: float 3.5s ease-in-out infinite;\n    }\n\n    @keyframes float {\n      0%, 100% { transform: translateY(0) rotate(-2deg); }\n      50% { transform: translateY(-10px) rotate(2deg); }\n    }\n\n    /* Shadow below mascot */\n    .mascot::after {\n      content: '';\n      position: absolute;\n      bottom: -8px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 100px;\n      height: 12px;\n      background: radial-gradient(ellipse, rgba(59,130,246,0.25), transparent 70%);\n      border-radius: 50%;\n      animation: shadowPulse 3.5s ease-in-out infinite;\n    }\n\n    @keyframes shadowPulse {\n      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }\n      50% { transform: translateX(-50%) scale(0.85); opacity: 0.4; }\n    }\n\n    .mascot-antenna {\n      position: absolute;\n      top: -20px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 4px;\n      height: 24px;\n      background: #94a3b8;\n      border-radius: 2px;\n    }\n\n    .mascot-antenna::after {\n      content: '';\n      position: absolute;\n      top: -10px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 16px;\n      height: 16px;\n      background: radial-gradient(circle at 30% 30%, #fde68a, #fbbf24);\n      border-radius: 50%;\n      box-shadow: 0 0 18px var(--yellow);\n      animation: glow 2s infinite;\n    }\n\n    @keyframes glow {\n      0%, 100% { box-shadow: 0 0 18px var(--yellow); }\n      50% { box-shadow: 0 0 30px var(--yellow), 0 0 45px rgba(251,191,36,0.5); }\n    }\n\n    .mascot-body {\n      position: absolute;\n      bottom: 0;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 120px;\n      height: 145px;\n      background: linear-gradient(160deg, #60a5fa, #3b82f6 60%, #2563eb);\n      border-radius: 55px 55px 35px 35px;\n      box-shadow: \n        0 12px 35px rgba(59,130,246,0.4),\n        inset 0 -10px 20px rgba(30,95,196,0.3),\n        inset 0 8px 15px rgba(255,255,255,0.25);\n    }\n\n    .mascot-face {\n      position: absolute;\n      top: 24px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 82px;\n      height: 60px;\n      background: linear-gradient(180deg, #ffffff, #f0f9ff);\n      border-radius: 32px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 16px;\n      box-shadow: \n        inset 0 -4px 10px rgba(59,130,246,0.12),\n        inset 0 3px 6px rgba(59,130,246,0.08);\n    }\n\n    .eye {\n      width: 13px;\n      height: 15px;\n      background: #1e3a5f;\n      border-radius: 50%;\n      position: relative;\n      transition: 0.15s;\n    }\n\n    .eye::after {\n      content: '';\n      position: absolute;\n      top: 3px;\n      left: 3px;\n      width: 5px;\n      height: 5px;\n      background: white;\n      border-radius: 50%;\n    }\n\n    .eye::before {\n      content: '';\n      position: absolute;\n      bottom: 1px;\n      right: 2px;\n      width: 3px;\n      height: 3px;\n      background: rgba(255,255,255,0.6);\n      border-radius: 50%;\n    }\n\n    .mascot.blink .eye {\n      height: 3px;\n      border-radius: 4px;\n      margin-top: 6px;\n    }\n\n    .mascot.blink .eye::after,\n    .mascot.blink .eye::before { display: none; }\n\n    .smile {\n      position: absolute;\n      bottom: 8px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 26px;\n      height: 12px;\n      border-bottom: 3.5px solid var(--yellow);\n      border-radius: 0 0 20px 20px;\n      transition: 0.3s;\n    }\n\n    .mascot.happy .smile {\n      width: 32px;\n      height: 16px;\n      border-width: 4px;\n    }\n\n    /* Pipi merona */\n    .cheek {\n      position: absolute;\n      width: 12px;\n      height: 8px;\n      background: rgba(244, 114, 182, 0.5);\n      border-radius: 50%;\n      top: 40px;\n      filter: blur(1px);\n      opacity: 0;\n      transition: 0.3s;\n    }\n\n    .cheek.left { left: 12px; }\n    .cheek.right { right: 12px; }\n\n    .mascot.happy .cheek { opacity: 1; }\n\n    .mascot-arms {\n      position: absolute;\n      bottom: 35px;\n      width: 100%;\n      display: flex;\n      justify-content: space-between;\n      padding: 0 -5px;\n    }\n\n    .arm {\n      width: 26px;\n      height: 56px;\n      background: linear-gradient(160deg, #60a5fa, #3b82f6);\n      border-radius: 14px;\n      transform-origin: top center;\n      animation: wave 2.2s ease-in-out infinite;\n      box-shadow: inset 0 -6px 10px rgba(30,95,196,0.25);\n      position: relative;\n    }\n\n    .arm::after {\n      content: '';\n      position: absolute;\n      bottom: -4px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 20px;\n      height: 20px;\n      background: radial-gradient(circle at 40% 40%, #93c5fd, #60a5fa);\n      border-radius: 50%;\n    }\n\n    .arm:last-child { animation-delay: 0.4s; }\n\n    @keyframes wave {\n      0%, 100% { transform: rotate(-8deg); }\n      30% { transform: rotate(-25deg); }\n      60% { transform: rotate(5deg); }\n    }\n\n    /* Kaki kecil */\n    .mascot-feet {\n      position: absolute;\n      bottom: -6px;\n      width: 100%;\n      display: flex;\n      justify-content: center;\n      gap: 30px;\n    }\n\n    .foot {\n      width: 26px;\n      height: 12px;\n      background: #1e40af;\n      border-radius: 8px 8px 12px 12px;\n      box-shadow: 0 4px 8px rgba(30,64,175,0.3);\n    }\n\n    /* Topi petugas parkir */\n    .mascot-cap {\n      position: absolute;\n      top: 8px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 70px;\n      height: 22px;\n      background: linear-gradient(180deg, #1e3a5f, #1e293b);\n      border-radius: 35px 35px 6px 6px;\n      z-index: 2;\n      box-shadow: 0 3px 8px rgba(0,0,0,0.2);\n    }\n\n    .mascot-cap::before {\n      content: '';\n      position: absolute;\n      bottom: -4px;\n      left: 50%;\n      transform: translateX(-50%);\n      width: 76px;\n      height: 8px;\n      background: #1e293b;\n      border-radius: 4px;\n    }\n\n    .mascot-cap::after {\n      content: 'P';\n      position: absolute;\n      top: 3px;\n      left: 50%;\n      transform: translateX(-50%);\n      color: var(--yellow);\n      font-family: 'Baloo 2', cursive;\n      font-weight: 900;\n      font-size: 13px;\n      text-shadow: 0 0 6px rgba(251,191,36,0.6);\n    }\n\n    .mascot-name {\n      position: absolute;\n      bottom: -32px;\n      left: 50%;\n      transform: translateX(-50%);\n      font-family: 'Baloo 2', cursive;\n      font-size: 14px;\n      font-weight: 800;\n      color: var(--blue);\n      letter-spacing: 2px;\n      white-space: nowrap;\n      background: white;\n      padding: 4px 14px;\n      border-radius: 12px;\n      box-shadow: 0 4px 12px rgba(59,130,246,0.15);\n      border: 1.5px solid var(--blue-light);\n    }\n\n    /* Bubble chat Parky */\n    .speech-bubble {\n      position: absolute;\n      top: 20px;\n      left: -10px;\n      background: white;\n      border: 2px solid var(--blue-light);\n      border-radius: 16px 16px 16px 4px;\n      padding: 8px 12px;\n      font-size: 12px;\n      font-weight: 800;\n      color: var(--blue);\n      box-shadow: 0 6px 16px rgba(59,130,246,0.15);\n      white-space: nowrap;\n      opacity: 0;\n      transform: scale(0.8) translateY(10px);\n      transition: 0.3s;\n      z-index: 5;\n      max-width: 140px;\n      white-space: normal;\n      text-align: center;\n      line-height: 1.3;\n    }\n\n    .speech-bubble.show {\n      opacity: 1;\n      transform: scale(1) translateY(0);\n    }\n\n    .speech-bubble::after {\n      content: '';\n      position: absolute;\n      bottom: -8px;\n      left: 20px;\n      width: 0;\n      height: 0;\n      border-left: 8px solid transparent;\n      border-right: 8px solid transparent;\n      border-top: 8px solid white;\n      filter: drop-shadow(0 2px 0 var(--blue-light));\n    }\n\n    /* ===== CARDS ===== */\n    .card {\n      background: var(--card);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      padding: 26px;\n      margin-bottom: 18px;\n      position: relative;\n      overflow: hidden;\n      transition: 0.3s;\n      border: 1px solid rgba(59,130,246,0.08);\n    }\n\n    .card:hover {\n      box-shadow: var(--shadow-hover);\n    }\n\n    /* Strip warna di atas card */\n    .card::before {\n      content: '';\n      position: absolute;\n      top: 0;\n      left: 0;\n      right: 0;\n      height: 5px;\n      background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6, #fbbf24, #34d399);\n      background-size: 200% 100%;\n      animation: rainbow 8s linear infinite;\n    }\n\n    @keyframes rainbow {\n      0% { background-position: 0% 0; }\n      100% { background-position: 200% 0; }\n    }\n\n    .card-title {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      font-size: 13px;\n      font-weight: 800;\n      color: var(--muted);\n      text-transform: uppercase;\n      letter-spacing: 1px;\n      margin-bottom: 20px;\n    }\n\n    .card-title .num {\n      width: 30px;\n      height: 30px;\n      background: linear-gradient(135deg, var(--blue), #6366f1);\n      color: white;\n      border-radius: 10px;\n      display: grid;\n      place-items: center;\n      font-size: 13px;\n      font-weight: 900;\n      box-shadow: 0 4px 10px rgba(59,130,246,0.3);\n      transform: rotate(-5deg);\n    }\n\n    /* ===== HOUR DISPLAY ===== */\n    .hour-big {\n      display: flex;\n      align-items: baseline;\n      gap: 12px;\n      margin-bottom: 18px;\n      justify-content: center;\n    }\n\n    .hour-number {\n      font-family: 'Baloo 2', cursive;\n      font-size: 84px;\n      font-weight: 800;\n      background: linear-gradient(160deg, #3b82f6, #6366f1);\n      -webkit-background-clip: text;\n      background-clip: text;\n      -webkit-text-fill-color: transparent;\n      line-height: 1;\n      transition: 0.2s;\n      filter: drop-shadow(0 4px 12px rgba(59,130,246,0.25));\n    }\n\n    .hour-number.bump {\n      transform: scale(1.1);\n    }\n\n    .hour-label {\n      font-size: 18px;\n      font-weight: 800;\n      color: var(--muted);\n    }\n\n    /* ===== SLIDER ===== */\n    .slider-wrap {\n      padding: 10px 0;\n    }\n\n    input[type=\"range\"] {\n      width: 100%;\n      height: 12px;\n      border-radius: 10px;\n      background: linear-gradient(90deg, #dbeafe, #bfdbfe);\n      outline: none;\n      -webkit-appearance: none;\n      cursor: pointer;\n      border: 1px solid #bfdbfe;\n    }\n\n    input[type=\"range\"]::-webkit-slider-thumb {\n      -webkit-appearance: none;\n      width: 34px;\n      height: 34px;\n      border-radius: 50%;\n      background: linear-gradient(160deg, #60a5fa, #3b82f6);\n      border: 4px solid white;\n      box-shadow: 0 4px 14px rgba(59,130,246,0.4);\n      cursor: pointer;\n      transition: 0.2s;\n      position: relative;\n    }\n\n    input[type=\"range\"]::-webkit-slider-thumb:hover {\n      transform: scale(1.15);\n      box-shadow: 0 6px 20px rgba(59,130,246,0.5);\n    }\n\n    input[type=\"range\"]::-moz-range-thumb {\n      width: 34px;\n      height: 34px;\n      border-radius: 50%;\n      background: linear-gradient(160deg, #60a5fa, #3b82f6);\n      border: 4px solid white;\n      box-shadow: 0 4px 14px rgba(59,130,246,0.4);\n      cursor: pointer;\n    }\n\n    .range-labels {\n      display: flex;\n      justify-content: space-between;\n      font-size: 12px;\n      color: var(--muted);\n      font-weight: 700;\n      margin-top: 10px;\n    }\n\n    /* ===== INPUT MANUAL ===== */\n    .manual-input {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n      margin-top: 20px;\n      padding: 16px;\n      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);\n      border-radius: 16px;\n      border: 1.5px dashed #93c5fd;\n      flex-wrap: wrap;\n    }\n\n    .manual-input label {\n      font-size: 14px;\n      font-weight: 800;\n      color: var(--blue-dark);\n      flex: 1;\n      min-width: 140px;\n    }\n\n    .manual-input input {\n      width: 90px;\n      padding: 12px 14px;\n      border: 2px solid var(--blue-light);\n      border-radius: 14px;\n      font-size: 18px;\n      font-weight: 800;\n      font-family: inherit;\n      color: var(--blue);\n      text-align: center;\n      outline: none;\n      transition: 0.2s;\n      background: white;\n    }\n\n    .manual-input input:focus {\n      border-color: var(--blue);\n      box-shadow: 0 0 0 4px rgba(59,130,246,0.15);\n      transform: scale(1.02);\n    }\n\n    /* ===== RESULT CARD ===== */\n    .result-card {\n      background: linear-gradient(160deg, #ffffff, #f0f9ff);\n      border: 2px solid var(--blue-light);\n      position: relative;\n    }\n\n    .total-price {\n      font-family: 'Baloo 2', cursive;\n      font-size: clamp(42px, 9vw, 62px);\n      font-weight: 800;\n      background: linear-gradient(135deg, #3b82f6, #6366f1);\n      -webkit-background-clip: text;\n      background-clip: text;\n      -webkit-text-fill-color: transparent;\n      text-align: center;\n      padding: 20px 0 8px;\n      transition: 0.3s;\n      filter: drop-shadow(0 4px 12px rgba(59,130,246,0.25));\n    }\n\n    .total-price.bump {\n      transform: scale(1.06);\n    }\n\n    .result-info {\n      text-align: center;\n      color: var(--muted);\n      font-size: 14px;\n      font-weight: 700;\n    }\n\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n      padding: 8px 16px;\n      border-radius: 20px;\n      font-size: 13px;\n      font-weight: 800;\n      margin-top: 12px;\n      transition: 0.3s;\n    }\n\n    .badge.discount {\n      background: linear-gradient(135deg, #d1fae5, #a7f3d0);\n      color: #059669;\n      border: 1.5px solid #6ee7b7;\n      animation: badgePop 0.5s ease;\n    }\n\n    .badge.normal {\n      background: var(--blue-light);\n      color: var(--blue);\n      border: 1.5px solid #93c5fd;\n    }\n\n    @keyframes badgePop {\n      0% { transform: scale(0.8); }\n      50% { transform: scale(1.1); }\n      100% { transform: scale(1); }\n    }\n\n    /* ===== BREAKDOWN ===== */\n    .breakdown {\n      margin-top: 20px;\n      padding: 18px;\n      background: #f8fbff;\n      border-radius: 16px;\n      border: 1.5px dashed #bfdbfe;\n    }\n\n    .breakdown-item {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      padding: 10px 0;\n      font-size: 14px;\n      border-bottom: 1px dashed #e0ecf7;\n    }\n\n    .breakdown-item:last-child { border-bottom: none; }\n\n    .breakdown-item span {\n      color: var(--muted);\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      gap: 8px;\n    }\n\n    .breakdown-item span::before {\n      content: '\u25b8';\n      color: var(--blue);\n      font-weight: 900;\n    }\n\n    .breakdown-item strong {\n      color: var(--text);\n      font-weight: 800;\n      font-size: 15px;\n    }\n\n    .breakdown-item.discount {\n      background: linear-gradient(90deg, #fef3c7, transparent);\n      border-radius: 8px;\n      padding: 10px 12px;\n      margin: 5px -12px;\n    }\n\n    .breakdown-item.discount span::before { content: '\ud83c\udf89'; color: #b45309; }\n    .breakdown-item.discount strong { color: #059669; }\n\n    /* ===== STEPS ===== */\n    .steps { display: grid; gap: 12px; }\n\n    .step {\n      display: flex;\n      gap: 14px;\n      padding: 16px 18px;\n      border-radius: 16px;\n      background: #f8fbff;\n      border: 2px solid #eef4fb;\n      transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);\n      align-items: flex-start;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .step::before {\n      content: '';\n      position: absolute;\n      left: 0;\n      top: 0;\n      bottom: 0;\n      width: 4px;\n      background: var(--blue);\n      transform: scaleY(0);\n      transform-origin: top;\n      transition: 0.3s;\n    }\n\n    .step.active::before { transform: scaleY(1); }\n\n    .step.active {\n      background: var(--blue-light);\n      border-color: var(--blue);\n      transform: translateX(4px);\n    }\n\n    .step.discount-active {\n      background: var(--yellow-light);\n      border-color: var(--yellow);\n    }\n\n    .step.discount-active::before { background: var(--yellow); }\n\n    .step-num {\n      width: 36px;\n      height: 36px;\n      border-radius: 12px;\n      background: white;\n      display: grid;\n      place-items: center;\n      font-family: 'Baloo 2', cursive;\n      font-weight: 800;\n      font-size: 16px;\n      color: var(--blue);\n      flex-shrink: 0;\n      box-shadow: 0 3px 10px rgba(59,130,246,0.12);\n      transition: 0.3s;\n    }\n\n    .step.active .step-num {\n      background: var(--blue);\n      color: white;\n      transform: rotate(-8deg) scale(1.1);\n      box-shadow: 0 6px 16px rgba(59,130,246,0.35);\n    }\n\n    .step.discount-active .step-num {\n      background: var(--yellow);\n      color: white;\n      animation: wiggle 0.6s ease;\n    }\n\n    @keyframes wiggle {\n      0%, 100% { transform: rotate(-8deg) scale(1.1); }\n      25% { transform: rotate(-15deg) scale(1.15); }\n      75% { transform: rotate(0deg) scale(1.1); }\n    }\n\n    .step-content {\n      flex: 1;\n      min-width: 0;\n    }\n\n    .step-label {\n      font-size: 11px;\n      font-weight: 900;\n      color: var(--blue);\n      text-transform: uppercase;\n      letter-spacing: 1px;\n      margin-bottom: 4px;\n    }\n\n    .step.discount-active .step-label { color: #b45309; }\n\n    .step-desc {\n      font-size: 13.5px;\n      color: var(--text);\n      line-height: 1.55;\n      font-weight: 600;\n    }\n\n    .step-desc strong {\n      color: var(--blue-dark);\n      font-weight: 900;\n      background: linear-gradient(180deg, transparent 65%, rgba(251,191,36,0.5) 65%);\n      padding: 0 2px;\n    }\n\n    .step.discount-active .step-desc strong {\n      color: #b45309;\n      background: linear-gradient(180deg, transparent 65%, rgba(251,191,36,0.7) 65%);\n    }\n\n    /* ===== INFO BOX ===== */\n    .info-box {\n      display: flex;\n      gap: 14px;\n      padding: 18px;\n      border-radius: 18px;\n      background: linear-gradient(135deg, #fef3c7, #fde68a);\n      border: 2px dashed #fbbf24;\n      margin-bottom: 20px;\n      align-items: flex-start;\n      position: relative;\n      overflow: hidden;\n    }\n\n    .info-box::before {\n      content: '';\n      position: absolute;\n      top: -20px;\n      right: -20px;\n      width: 80px;\n      height: 80px;\n      background: radial-gradient(circle, rgba(255,255,255,0.6), transparent);\n      border-radius: 50%;\n    }\n\n    .info-icon {\n      font-size: 28px;\n      flex-shrink: 0;\n      animation: bounce 2s infinite;\n    }\n\n    @keyframes bounce {\n      0%, 100% { transform: translateY(0) rotate(-5deg); }\n      50% { transform: translateY(-5px) rotate(5deg); }\n    }\n\n    .info-text {\n      font-size: 13.5px;\n      color: #92400e;\n      font-weight: 700;\n      line-height: 1.6;\n      position: relative;\n      z-index: 1;\n    }\n\n    /* ===== RESET BUTTON ===== */\n    .reset-btn {\n      width: 100%;\n      padding: 15px;\n      border: 2px solid var(--blue-light);\n      background: white;\n      color: var(--blue);\n      border-radius: 16px;\n      font-family: inherit;\n      font-size: 15px;\n      font-weight: 800;\n      cursor: pointer;\n      transition: 0.25s;\n      margin-top: 20px;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 8px;\n    }\n\n    .reset-btn:hover {\n      background: var(--blue);\n      color: white;\n      transform: translateY(-2px);\n      box-shadow: 0 8px 20px rgba(59,130,246,0.3);\n      border-color: var(--blue);\n    }\n\n    .reset-btn:active { transform: translateY(0); }\n\n    /* ===== KONFETI ===== */\n    .confetti {\n      position: fixed;\n      width: 10px;\n      height: 10px;\n      pointer-events: none;\n      z-index: 100;\n      animation: fall 3s linear forwards;\n    }\n\n    @keyframes fall {\n      0% {\n        transform: translateY(-20vh) rotate(0deg);\n        opacity: 1;\n      }\n      100% {\n        transform: translateY(110vh) rotate(720deg);\n        opacity: 0;\n      }\n    }\n\n    /* ===== RATING PARKY ===== */\n    .parky-rating {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 4px;\n      margin-top: 15px;\n      font-size: 11px;\n      font-weight: 700;\n      color: var(--muted);\n    }\n\n    .stars { color: var(--yellow); font-size: 14px; letter-spacing: 1px; }\n\n    /* Footer */\n    .footer {\n      text-align: center;\n      padding: 30px 20px;\n      color: var(--muted);\n      font-size: 12px;\n      font-weight: 700;\n      position: relative;\n      z-index: 2;\n    }\n\n    .footer .heart {\n      color: var(--pink);\n      display: inline-block;\n      animation: heartbeat 1.5s infinite;\n    }\n\n    @keyframes heartbeat {\n      0%, 100% { transform: scale(1); }\n      50% { transform: scale(1.25); }\n    }\n\n    /* Responsive */\n    @media (max-width: 640px) {\n      .hero { flex-direction: column-reverse; text-align: center; }\n      .hero-text p { margin: 0 auto; }\n      .mascot-wrap { width: 170px; height: 200px; }\n      .mascot-body { width: 100px; height: 120px; }\n      .mascot-face { width: 68px; height: 50px; top: 20px; }\n      .mascot-cap { width: 58px; height: 18px; }\n      .mascot-cap::before { width: 64px; }\n      .hour-number { font-size: 68px; }\n      .card { padding: 20px; }\n      .header { padding: 12px 16px; }\n      .header-badge { display: none; }\n      .logo { font-size: 18px; }\n      .logo-icon { width: 36px; height: 36px; font-size: 18px; }\n      .floating-emoji { font-size: 22px; }\n      .speech-bubble { left: 0; font-size: 11px; }\n    }\n  <\/style>\n<\/head>\n<body>\n\n  <!-- Background dekoratif -->\n  <div class=\"bg-deco\">\n    <div class=\"bg-shape s1\"><\/div>\n    <div class=\"bg-shape s2\"><\/div>\n    <div class=\"bg-shape s3\"><\/div>\n    <div class=\"bg-shape s4\"><\/div>\n  <\/div>\n\n  <!-- Emoji mengambang -->\n  <div class=\"floating-emoji\" style=\"top: 15%; left: 5%; animation-delay: 0s;\">\ud83c\udd7f\ufe0f<\/div>\n  <div class=\"floating-emoji\" style=\"top: 25%; right: 8%; animation-delay: -1s;\">\ud83d\ude97<\/div>\n  <div class=\"floating-emoji\" style=\"top: 55%; left: 3%; animation-delay: -2s;\">\ud83d\udcb0<\/div>\n  <div class=\"floating-emoji\" style=\"bottom: 20%; right: 5%; animation-delay: -3s;\">\u2b50<\/div>\n  <div class=\"floating-emoji\" style=\"top: 45%; right: 4%; animation-delay: -4s;\">\ud83c\udf89<\/div>\n  <div class=\"floating-emoji\" style=\"bottom: 35%; left: 6%; animation-delay: -1.5s;\">\ud83d\ude99<\/div>\n\n  <header class=\"header\">\n    <div class=\"logo\">\n      <div class=\"logo-icon\">P<\/div>\n      Smart<span>Park<\/span>\n    <\/div>\n    <div class=\"header-badge\">Live<\/div>\n  <\/header>\n\n  <main class=\"container\">\n\n    <!-- Hero + Mascot -->\n    <section class=\"hero\">\n      <div class=\"hero-text\">\n        <div class=\"hero-tag\">\u2728 Parkir Jadi Gampang!<\/div>\n        <h1>Hitung parkir jadi <em>seru!<\/em><\/h1>\n        <p>Geser slider dan biarkan Parky menghitung biaya parkir kamu secara otomatis. Cepat, akurat, dan pastinya menyenangkan! \ud83d\ude97<\/p>\n        <div class=\"parky-rating\">\n          <span class=\"stars\">\u2605\u2605\u2605\u2605\u2605<\/span>\n          <span>Dipercaya 1.000+ pengunjung<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"mascot-wrap\">\n        <div class=\"speech-bubble\" id=\"speechBubble\">Hai! Aku Parky \ud83d\udc4b<\/div>\n        <div class=\"mascot\" id=\"mascot\">\n          <div class=\"mascot-antenna\"><\/div>\n          <div class=\"mascot-body\">\n            <div class=\"mascot-cap\"><\/div>\n            <div class=\"mascot-face\">\n              <div class=\"eye\"><\/div>\n              <div class=\"eye\"><\/div>\n              <div class=\"cheek left\"><\/div>\n              <div class=\"cheek right\"><\/div>\n              <div class=\"smile\"><\/div>\n            <\/div>\n            <div class=\"mascot-arms\">\n              <div class=\"arm\"><\/div>\n              <div class=\"arm\"><\/div>\n            <\/div>\n            <div class=\"mascot-feet\">\n              <div class=\"foot\"><\/div>\n              <div class=\"foot\"><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"mascot-name\">PARKY<\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- Input Card -->\n    <section class=\"card\">\n      <div class=\"card-title\">\n        <div class=\"num\">1<\/div>\n        Berapa lama kamu parkir?\n      <\/div>\n\n      <div class=\"hour-big\">\n        <div class=\"hour-number\" id=\"hourDisplay\">6<\/div>\n        <div class=\"hour-label\">jam<\/div>\n      <\/div>\n\n      <div class=\"slider-wrap\">\n        <input type=\"range\" id=\"slider\" min=\"1\" max=\"24\" value=\"6\" step=\"1\">\n      <\/div>\n\n      <div class=\"range-labels\">\n        <span>\ud83c\udf05 1 jam<\/span>\n        <span>\ud83c\udf19 24 jam<\/span>\n      <\/div>\n\n      <div class=\"manual-input\">\n        <label>\u270f\ufe0f Atau ketik langsung:<\/label>\n        <input type=\"number\" id=\"manualInput\" min=\"1\" max=\"24\" value=\"6\">\n      <\/div>\n    <\/section>\n\n    <!-- Result Card -->\n    <section class=\"card result-card\">\n      <div class=\"card-title\">\n        <div class=\"num\">2<\/div>\n        Total biaya parkir kamu\n      <\/div>\n\n      <div class=\"total-price\" id=\"totalPrice\">Rp 18.000<\/div>\n\n      <div class=\"result-info\">\n        <span id=\"durationText\">6 jam parkir<\/span><br>\n        <span class=\"badge discount\" id=\"badge\">\ud83c\udf89 Diskon Aktif!<\/span>\n      <\/div>\n\n      <div class=\"breakdown\">\n        <div class=\"breakdown-item\">\n          <span>Jam pertama<\/span>\n          <strong>Rp 5.000<\/strong>\n        <\/div>\n        <div class=\"breakdown-item\">\n          <span id=\"extraLabel\">5 jam berikutnya \u00d7 Rp 3.000<\/span>\n          <strong id=\"extraCost\">Rp 15.000<\/strong>\n        <\/div>\n        <div class=\"breakdown-item discount\" id=\"discountRow\">\n          <span>Diskon spesial (parkir &gt; 5 jam)<\/span>\n          <strong>\u2212 Rp 2.000<\/strong>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- Explanation Card -->\n    <section class=\"card\">\n      <div class=\"card-title\">\n        <div class=\"num\">3<\/div>\n        Gimana cara Parky hitung?\n      <\/div>\n\n      <div class=\"info-box\">\n        <div class=\"info-icon\">\ud83d\udca1<\/div>\n        <div class=\"info-text\">\n          Parky pakai aturan simpel: jam pertama <b>Rp 5.000<\/b>, jam berikutnya <b>Rp 3.000/jam<\/b>, dan ada <b>diskon Rp 2.000<\/b> kalau parkir lebih dari 5 jam. Gampang kan?\n        <\/div>\n      <\/div>\n\n      <div class=\"steps\">\n        <div class=\"step\" id=\"step1\">\n          <div class=\"step-num\">1<\/div>\n          <div class=\"step-content\">\n            <div class=\"step-label\">Baca Durasi Parkir<\/div>\n            <div class=\"step-desc\">Kamu parkir selama <strong id=\"stepHours\">6 jam<\/strong>. \ud83d\udd50<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"step\" id=\"step2\">\n          <div class=\"step-num\">2<\/div>\n          <div class=\"step-content\">\n            <div class=\"step-label\">Hitung Jam Pertama<\/div>\n            <div class=\"step-desc\" id=\"step2Desc\">Jam pertama dikenakan <strong>Rp 5.000<\/strong>. \ud83d\udcb5<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"step\" id=\"step3\">\n          <div class=\"step-num\">3<\/div>\n          <div class=\"step-content\">\n            <div class=\"step-label\">Hitung Jam Berikutnya<\/div>\n            <div class=\"step-desc\" id=\"step3Desc\">Sisa 5 jam \u00d7 Rp 3.000 = <strong>Rp 15.000<\/strong>. \u23f0<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"step\" id=\"step4\">\n          <div class=\"step-num\">4<\/div>\n          <div class=\"step-content\">\n            <div class=\"step-label\">Cek Diskon Spesial<\/div>\n            <div class=\"step-desc\" id=\"step4Desc\">Parkir lebih dari 5 jam? <strong>Ya, dapat diskon Rp 2.000!<\/strong> \ud83c\udf81<\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"step\" id=\"step5\">\n          <div class=\"step-num\">5<\/div>\n          <div class=\"step-content\">\n            <div class=\"step-label\">Total Akhir<\/div>\n            <div class=\"step-desc\">Biaya parkir kamu: <strong id=\"stepFinal\">Rp 18.000<\/strong>. \u2705<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <button class=\"reset-btn\" id=\"resetBtn\">\ud83d\udd04 Reset ke 6 Jam<\/button>\n    <\/section>\n\n  <\/main>\n\n  <footer class=\"footer\">\n    Dibuat dengan <span class=\"heart\">\u2665<\/span> untuk belajar logika if-else<br>\n    SmartPark \u00a9 2025 \u2022 Parky siap membantu!\n  <\/footer>\n\n  <script>\n    const slider = document.getElementById('slider');\n    const manualInput = document.getElementById('manualInput');\n    const hourDisplay = document.getElementById('hourDisplay');\n    const totalPrice = document.getElementById('totalPrice');\n    const durationText = document.getElementById('durationText');\n    const badge = document.getElementById('badge');\n    const extraLabel = document.getElementById('extraLabel');\n    const extraCost = document.getElementById('extraCost');\n    const discountRow = document.getElementById('discountRow');\n    const stepHours = document.getElementById('stepHours');\n    const step2 = document.getElementById('step2');\n    const step3 = document.getElementById('step3');\n    const step4 = document.getElementById('step4');\n    const step2Desc = document.getElementById('step2Desc');\n    const step3Desc = document.getElementById('step3Desc');\n    const step4Desc = document.getElementById('step4Desc');\n    const stepFinal = document.getElementById('stepFinal');\n    const mascot = document.getElementById('mascot');\n    const speechBubble = document.getElementById('speechBubble');\n\n    // Pesan-pesan Parky berdasarkan durasi\n    const parkyMessages = {\n      short: ['Parkir sebentar ya? \ud83d\ude0a', 'Cepat banget! \u26a1', 'Hemat nih! \ud83d\udcb0'],\n      medium: ['Lumayan lama nih \ud83d\ude97', 'Parkir santai ya~ \ud83d\ude0e', 'Masih aman di kantong! \ud83d\udc4d'],\n      long: ['Wah, lama juga! \ud83d\udd50', 'Dapat diskon nih! \ud83c\udf89', 'Hore, hemat Rp 2.000! \ud83c\udf81']\n    };\n\n    let lastDiscountState = null;\n    let messageTimeout;\n\n    function formatRupiah(n) {\n      return 'Rp ' + n.toLocaleString('id-ID');\n    }\n\n    function getParkyMessage(jam, discount) {\n      let pool;\n      if (jam <= 2) pool = parkyMessages.short;\n      else if (jam <= 5) pool = parkyMessages.medium;\n      else pool = parkyMessages.long;\n      return pool[Math.floor(Math.random() * pool.length)];\n    }\n\n    function showSpeech(text) {\n      speechBubble.textContent = text;\n      speechBubble.classList.add('show');\n      clearTimeout(messageTimeout);\n      messageTimeout = setTimeout(() => {\n        speechBubble.classList.remove('show');\n      }, 2500);\n    }\n\n    function createConfetti() {\n      const colors = ['#3b82f6', '#fbbf24', '#34d399', '#f472b6', '#a78bfa', '#fb923c'];\n      const shapes = ['\u25cf', '\u25a0', '\u25b2', '\u2605', '\u2665'];\n\n      for (let i = 0; i < 40; i++) {\n        setTimeout(() => {\n          const confetti = document.createElement('div');\n          confetti.className = 'confetti';\n          confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];\n          confetti.style.left = Math.random() * 100 + 'vw';\n          confetti.style.top = '-20px';\n          confetti.style.color = colors[Math.floor(Math.random() * colors.length)];\n          confetti.style.fontSize = (10 + Math.random() * 14) + 'px';\n          confetti.style.animationDuration = (2 + Math.random() * 2) + 's';\n          confetti.style.animationDelay = Math.random() * 0.5 + 's';\n          document.body.appendChild(confetti);\n\n          setTimeout(() => confetti.remove(), 4000);\n        }, i * 30);\n      }\n    }\n\n    function calculate(value) {\n      let jam = parseInt(value, 10);\n      if (isNaN(jam) || jam < 1) jam = 1;\n      if (jam > 24) jam = 24;\n\n      // Update inputs\n      slider.value = jam;\n      manualInput.value = jam;\n      hourDisplay.textContent = jam;\n      hourDisplay.classList.add('bump');\n      setTimeout(() => hourDisplay.classList.remove('bump'), 200);\n\n      // Logic\n      const firstHour = jam <= 1;\n      let base, extra;\n      if (firstHour) {\n        base = 5000;\n        extra = 0;\n      } else {\n        extra = (jam - 1) * 3000;\n        base = 5000 + extra;\n      }\n\n      const discount = jam > 5 ? 2000 : 0;\n      const final = base - discount;\n\n      // Update result\n      totalPrice.textContent = formatRupiah(final);\n      totalPrice.classList.add('bump');\n      setTimeout(() => totalPrice.classList.remove('bump'), 250);\n\n      durationText.textContent = jam + ' jam parkir';\n\n      if (discount > 0) {\n        badge.textContent = '\ud83c\udf89 Diskon Aktif! Hemat Rp 2.000';\n        badge.className = 'badge discount';\n        discountRow.style.display = 'flex';\n      } else {\n        badge.textContent = '\ud83d\udc4d Tarif Normal';\n        badge.className = 'badge normal';\n        discountRow.style.display = 'none';\n      }\n\n      // Breakdown\n      if (firstHour) {\n        extraLabel.textContent = 'Tidak ada jam tambahan';\n        extraCost.textContent = 'Rp 0';\n      } else {\n        extraLabel.textContent = (jam - 1) + ' jam berikutnya \u00d7 Rp 3.000';\n        extraCost.textContent = formatRupiah(extra);\n      }\n\n      // Steps\n      stepHours.textContent = jam + ' jam';\n\n      if (firstHour) {\n        step2Desc.innerHTML = 'Karena cuma 1 jam, langsung dikenakan <strong>Rp 5.000<\/strong>. \ud83d\udcb5';\n        step3Desc.innerHTML = 'Tidak ada jam tambahan. \ud83d\udc4d';\n        step4Desc.innerHTML = 'Parkir 1 jam, <strong>tidak dapat diskon<\/strong>. \ud83d\ude0a';\n        step2.classList.add('active');\n        step3.classList.remove('active');\n        step4.classList.remove('active', 'discount-active');\n      } else {\n        step2Desc.innerHTML = 'Jam pertama dikenakan <strong>Rp 5.000<\/strong>. \ud83d\udcb5';\n        step3Desc.innerHTML = 'Sisa ' + (jam - 1) + ' jam \u00d7 Rp 3.000 = <strong>' + formatRupiah(extra) + '<\/strong>. \u23f0';\n        step2.classList.add('active');\n        step3.classList.add('active');\n\n        if (discount > 0) {\n          step4Desc.innerHTML = 'Parkir lebih dari 5 jam? <strong>Ya, dapat diskon Rp 2.000!<\/strong> \ud83c\udf81';\n          step4.classList.add('active', 'discount-active');\n        } else {\n          step4Desc.innerHTML = 'Parkir tidak lebih dari 5 jam, <strong>tidak dapat diskon<\/strong>. \ud83d\ude0a';\n          step4.classList.add('active');\n          step4.classList.remove('discount-active');\n        }\n      }\n\n      stepFinal.textContent = formatRupiah(final);\n      document.getElementById('step1').classList.add('active');\n\n      // Mascot reaction\n      mascot.classList.add('blink');\n      setTimeout(() => mascot.classList.remove('blink'), 200);\n\n      // Mascot happy kalau diskon\n      if (discount > 0) {\n        mascot.classList.add('happy');\n      } else {\n        mascot.classList.remove('happy');\n      }\n\n      // Konfeti saat pertama kali masuk mode diskon\n      if (discount > 0 && lastDiscountState !== true) {\n        createConfetti();\n        lastDiscountState = true;\n      } else if (discount === 0) {\n        lastDiscountState = false;\n      }\n\n      // Speech bubble\n      if (value !== undefined) {\n        const msg = getParkyMessage(jam, discount);\n        showSpeech(msg);\n      }\n    }\n\n    // Events\n    slider.addEventListener('input', (e) => calculate(e.target.value));\n    manualInput.addEventListener('input', (e) => calculate(e.target.value));\n    document.getElementById('resetBtn').addEventListener('click', () => {\n      calculate(6);\n      showSpeech('Siap hitung lagi! \ud83d\ude80');\n    });\n\n    // Init \u2014 tanpa konfeti & tanpa bubble di awal\n    calculate(6);\n\n    // Show welcome bubble setelah 1 detik\n    setTimeout(() => showSpeech('Hai! Aku Parky \ud83d\udc4b'), 1000);\n\n    // Blink otomatis tiap beberapa detik\n    setInterval(() => {\n      mascot.classList.add('blink');\n      setTimeout(() => mascot.classList.remove('blink'), 180);\n    }, 4000);\n  <\/script>\n\n<\/body>\n<\/html>","<!DOCTYPE html>\n<html lang=\"id\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>SwiftMart Kasir Man var NAMES=["SmartPark","SwiftMart"];
